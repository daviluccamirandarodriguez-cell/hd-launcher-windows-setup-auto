name: Gerar Setup EXE do HD Launcher

on:
  workflow_dispatch:
    inputs:
      publicar_release:
        description: 'Publicar o Setup.exe da versão atual no GitHub Releases (depois de testar)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'installer/**'
      - 'setup.iss'
      - '.github/workflows/gerar-setup-windows.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Compilar Setup para Windows
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python no servidor de compilação
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Instalar ferramentas de compilação
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rodar testes da biblioteca e dos jogos
        shell: pwsh
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Criar aplicativo Windows sem Python externo
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HDLauncher --icon "assets\hd-launcher.ico" --add-data "assets:assets" hd_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller falhou" }
          if (!(Test-Path 'dist\HDLauncher\HDLauncher.exe')) { throw "Executavel nao foi gerado" }
          if (!(Test-Path 'dist\HDLauncher\_internal\assets\hd-logo.png')) { throw "Logo nao incluida no pacote" }
          if (!(Get-ChildItem 'dist\HDLauncher' -Filter 'qwindows.dll' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "Plugin Qt para Windows nao incluido" }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $iscc = '${{ runner.temp }}\iscc-path.txt'
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")
          if (!($candidates | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel instalar Inno Setup" }
          }
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw "ISCC.exe nao encontrado" }
          $compiler | Out-File -FilePath $iscc -Encoding utf8

      - name: Criar HDLauncher Setup.exe
        shell: pwsh
        run: |
          $compiler = Get-Content '${{ runner.temp }}\iscc-path.txt' -Raw
          & $compiler.Trim() setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilacao do Setup falhou" }
          if (!(Test-Path 'installer-output\HDLauncher-Setup-v1.7.0.exe')) { throw "Setup nao encontrado" }
          Copy-Item 'installer-output\HDLauncher-Setup-v1.7.0.exe' 'installer-output\HDLauncher-Setup.exe'
          Get-Item 'installer-output\HDLauncher-Setup-v1.7.0.exe' | Select-Object Name, Length

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: HDLauncher-Setup-v1.7.0
          path: |
            installer-output/HDLauncher-Setup-v1.7.0.exe
            installer-output/HDLauncher-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar atualização para todos os jogadores (opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.publicar_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.7.0'
          $first = 'installer-output/HDLauncher-Setup-v1.7.0.exe'
          $stable = 'installer-output/HDLauncher-Setup.exe'
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $first $stable --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag $first $stable --target "$env:GITHUB_SHA" --title "HD Launcher v1.7.0" --notes "Atualização automática: procura, verifica SHA-256, instala e reinicia. Contas e jogos locais preservados." --latest --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível publicar a Release' }
